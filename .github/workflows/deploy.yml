name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy-site-1
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Build and restart site-1 on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          LISTING_INBOX_EMAIL: ${{ secrets.LISTING_INBOX_EMAIL }}
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 15m
          envs: LISTING_INBOX_EMAIL
          script: |
            set -euo pipefail
            APP_DIR=/var/www/site-1
            APP_NAME=site-1
            ORIGIN=https://github.com/huncash/site-1_newdev.git
            test -d "$APP_DIR"
            cd "$APP_DIR"
            echo "user=$(id) pwd=$(pwd)"
            stat -c '%n %U:%G %a' . .git .git/config 2>/dev/null || true
            if [[ ! -w .git ]]; then
              echo "Repairing ownership of $APP_DIR for $(id -un)"
              sudo -n chown -R "$(id -un):$(id -gn)" "$APP_DIR"
            fi
            rm -f .git/config.lock 2>/dev/null || sudo -n rm -f .git/config.lock
            git config --global --add safe.directory "$APP_DIR" || true
            current="$(git remote get-url origin 2>/dev/null || true)"
            if [[ "$current" != "$ORIGIN" ]]; then
              git remote set-url origin "$ORIGIN" || {
                sudo -n chown -R "$(id -un):$(id -gn)" "$APP_DIR"
                git remote set-url origin "$ORIGIN"
              }
            fi
            git fetch origin
            git reset --hard origin/main
            npm install
            if [[ ! -f .env.local ]] || ! grep -q '^QUOTE_INBOX_EMAIL=.' .env.local || ! grep -q '^SMTP_HOST=.' .env.local || ! grep -q '^RECAPTCHA_SECRET_KEY=.' .env.local || ! grep -q '^NEXT_PUBLIC_RECAPTCHA_SITE_KEY=.' .env.local; then
              echo "WARNING: quote mail or reCAPTCHA is not fully set in .env.local; quote emails will not be sent"
            fi
            if [[ -n "${LISTING_INBOX_EMAIL:-}" ]]; then
              touch .env.local
              if grep -q '^LISTING_INBOX_EMAIL=' .env.local; then
                sed -i "s|^LISTING_INBOX_EMAIL=.*|LISTING_INBOX_EMAIL=${LISTING_INBOX_EMAIL}|" .env.local
              else
                printf '\nLISTING_INBOX_EMAIL=%s\n' "$LISTING_INBOX_EMAIL" >> .env.local
              fi
              echo "LISTING_INBOX_EMAIL synced from GitHub secret"
            elif [[ ! -f .env.local ]] || ! grep -q '^LISTING_INBOX_EMAIL=.' .env.local; then
              echo "WARNING: LISTING_INBOX_EMAIL is not set; listing enquiries fall back to QUOTE_INBOX_EMAIL if present"
            fi
            rm -rf .next
            npm run build
            pm2 delete "$APP_NAME" || true
            pm2 start npm --name "$APP_NAME" --cwd "$APP_DIR" -- start
            pm2 save
            ss -lptn | grep -E ':3000\b' || true
            pm2 status
            if [[ -f "$APP_DIR/scripts/ensure-eladoingatlan-vhost.sh" ]]; then
              sed -i 's/\r$//' "$APP_DIR/scripts/ensure-eladoingatlan-vhost.sh" || true
              chmod 755 "$APP_DIR/scripts/ensure-eladoingatlan-vhost.sh"
              bash "$APP_DIR/scripts/ensure-eladoingatlan-vhost.sh"
            else
              echo "WARNING: ensure-eladoingatlan-vhost.sh missing; skip nginx listing vhost"
            fi
