name: Route bim.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bim-vhost.yml"

concurrency:
  group: bim-vhost
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Add bim.vrgo.hu to the site-1 vhost and reload nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            sudo -n true
            echo "==== before ===="
            sudo -n grep -RIn --include='*' -E 'server_name|proxy_pass' /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/conf.d || true
            sudo -n python3 - << 'PY'
            import pathlib, re, sys
            roots = [pathlib.Path("/etc/nginx/sites-available"), pathlib.Path("/etc/nginx/conf.d")]
            proxy = re.compile(r"proxy_pass\s+https?://(?:127\.0\.0\.1|localhost):3000\b")
            files = []
            for root in roots:
                if not root.is_dir():
                    continue
                for path in root.rglob("*"):
                    if not path.is_file() or path.suffix == ".bak-bim":
                        continue
                    text = path.read_text(errors="replace")
                    if "vrgo.hu" in text and proxy.search(text):
                        files.append(path)
            if not files:
                sys.exit("no site-1 vhost proxies to 127.0.0.1:3000")
            for path in files:
                original = path.read_text()
                def add_name(match):
                    line = match.group(0)
                    if "bim.vrgo.hu" in line or "vrgo.hu" not in line:
                        return line
                    return line.replace(";", " bim.vrgo.hu;", 1)
                updated, _ = re.subn(r"(?m)^[ \t]*server_name\b[^;]*;", add_name, original)
                if updated == original:
                    print(f"already set {path}")
                    continue
                backup = path.with_name(path.name + ".bak-bim")
                if not backup.exists():
                    backup.write_text(original)
                path.write_text(updated)
                print(f"updated {path}")
            PY
            echo "==== server_name ===="
            sudo -n grep -RIn "server_name" /etc/nginx/sites-available /etc/nginx/sites-enabled /etc/nginx/conf.d || true
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "==== origin check ===="
            curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true
            if sudo -n certbot --nginx --non-interactive --expand --keep-until-expiring --redirect -d vrgo.hu -d www.vrgo.hu -d bim.vrgo.hu; then
              sudo -n nginx -t
              sudo -n systemctl reload nginx
              echo "certbot=ok"
            else
              echo "CERTBOT_FAILED vhost reload already done"
              exit 1
            fi
