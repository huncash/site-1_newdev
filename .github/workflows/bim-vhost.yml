name: Route bim.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bim-vhost.yml"

concurrency:
  group: bim-vhost
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Point bim.vrgo.hu at site-1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            sudo -n true
            sudo -n python3 - << 'PY'
            import pathlib, re
            enabled = pathlib.Path("/etc/nginx/sites-enabled")
            vrgo = (enabled / "vrgo.hu").read_text()
            cert = re.search(r"ssl_certificate\s+([^;]+);", vrgo)
            key = re.search(r"ssl_certificate_key\s+([^;]+);", vrgo)
            if not cert or not key:
                raise SystemExit("vrgo.hu has no ssl_certificate")
            include = ""
            for line in vrgo.splitlines():
                stripped = line.strip()
                if stripped.startswith("include ") and ("options-ssl" in stripped or "ssl-dhparams" in stripped):
                    include += "    " + stripped + "\n"
            block = f"""server {{
                listen 80;
                listen [::]:80;
                listen 443 ssl;
                listen [::]:443 ssl;
                server_name bim.vrgo.hu;
                ssl_certificate {cert.group(1)};
                ssl_certificate_key {key.group(1)};
            {include}
                location / {{
                    proxy_pass http://127.0.0.1:3000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection "upgrade";
                }}
            }}
            """
            target = enabled / "bim.vrgo.hu"
            target.write_text(block)
            print(f"wrote {target}")
            for path in list(enabled.iterdir()) + list(pathlib.Path("/etc/nginx/sites-available").glob("*")):
                if not path.is_file() or path.name == "bim.vrgo.hu":
                    continue
                text = path.read_text(errors="replace")
                if "bim.vrgo.hu" not in text or path.resolve() == target.resolve():
                    continue
                updated = re.sub(r"[ \t]+bim\.vrgo\.hu", "", text)
                if updated != text:
                    path.write_text(updated)
                    print(f"removed duplicate name from {path}")
            PY
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            title="$(curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true)"
            echo "title=${title}"
            case "$title" in
              *Offline*) echo "still default vhost"; exit 1 ;;
            esac
            sudo -n certbot --nginx --non-interactive --expand --keep-until-expiring -d vrgo.hu -d www.vrgo.hu -d bim.vrgo.hu || echo "CERTBOT_FAILED"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
