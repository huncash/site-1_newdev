name: Route bim.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bim-vhost.yml"

concurrency:
  group: bim-vhost
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Read the live vhost and add bim.vrgo.hu if sudo allows it
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vrgo
          chmod 600 ~/.ssh/vrgo
          ssh -i ~/.ssh/vrgo -o StrictHostKeyChecking=accept-new deploy@195.228.152.141 'bash -s' << 'EOF' > ops-nginx-live.txt
          set -uo pipefail
          echo "user=$(id)"
          echo "===== LS ====="
          ls -l /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu /etc/nginx/sites-enabled/offlinebiztonsag.hu
          echo "===== AVAILABLE ====="
          sed -n '1,250p' /etc/nginx/sites-available/vrgo.hu
          echo "===== ENABLED ====="
          sed -n '1,250p' /etc/nginx/sites-enabled/vrgo.hu
          echo "===== OFFLINE ====="
          grep -nE 'server_name|listen |proxy_pass|default_server' /etc/nginx/sites-enabled/offlinebiztonsag.hu || true
          if sudo -n true; then
            echo "sudo=yes"
            for f in /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu; do
              sudo -n sed -i.bak-bim '/^[[:space:]]*server_name /{ /bim\.vrgo\.hu/! s/;/ bim.vrgo.hu;/ }' "$f"
              echo "edited $f"
            done
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "===== TITLE ====="
            curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true
            echo "===== ENABLED AFTER ====="
            sed -n '1,250p' /etc/nginx/sites-enabled/vrgo.hu
          else
            echo "sudo=no"
          fi
          EOF
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add ops-nginx-live.txt
          git commit -m "Record the live vrgo Nginx vhost."
          git push origin HEAD
