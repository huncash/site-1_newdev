name: Route bim.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bim-vhost.yml"

concurrency:
  group: bim-vhost
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Add bim.vrgo.hu to the live vrgo vhost
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -uo pipefail
            echo "user=$(id)"
            echo "==== ls ===="
            ls -l /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu /etc/nginx/sites-enabled/offlinebiztonsag.hu
            echo "==== AVAILABLE ===="
            sed -n '1,250p' /etc/nginx/sites-available/vrgo.hu
            echo "==== ENABLED ===="
            sed -n '1,250p' /etc/nginx/sites-enabled/vrgo.hu
            echo "==== OFFLINE ===="
            grep -nE 'server_name|listen |proxy_pass|default_server' /etc/nginx/sites-enabled/offlinebiztonsag.hu || true
            if ! sudo -n true; then
              echo "sudo=no"
              exit 1
            fi
            echo "sudo=yes"
            sudo -n python3 - << 'PY'
            import pathlib, re
            paths = []
            for raw in ("/etc/nginx/sites-available/vrgo.hu", "/etc/nginx/sites-enabled/vrgo.hu"):
                path = pathlib.Path(raw)
                if path.exists():
                    real = path.resolve()
                    if real not in paths:
                        paths.append(real)
            if not paths:
                raise SystemExit("vrgo.hu nginx file missing")
            name = "bim.vrgo.hu"
            for path in paths:
                original = path.read_text()
                def add_name(match):
                    line = match.group(0)
                    if name in line:
                        return line
                    return line.replace(";", f" {name};", 1)
                updated, count = re.subn(r"(?m)^[ \t]*server_name\b[^;]*;", add_name, original)
                if updated == original:
                    print(f"unchanged {path} server_name_lines={count}")
                    continue
                backup = pathlib.Path(str(path) + ".bak-bim")
                if not backup.exists():
                    backup.write_text(original)
                path.write_text(updated)
                print(f"updated {path}")
            PY
            echo "==== server_name after ===="
            grep -n server_name /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            title="$(curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true)"
            echo "title=${title}"
            case "$title" in
              *Offline*) echo "still default vhost"; exit 1 ;;
            esac
            sudo -n certbot --nginx --non-interactive --expand --keep-until-expiring -d vrgo.hu -d www.vrgo.hu -d bim.vrgo.hu || echo "CERTBOT_FAILED"
            sudo -n nginx -t
            sudo -n systemctl reload nginx
