name: Route bim.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bim-vhost.yml"

concurrency:
  group: bim-vhost
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Point bim.vrgo.hu at site-1
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -uo pipefail
            echo "user=$(id)"
            echo "==== vrgo.hu ===="
            sed -n '1,220p' /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu 2>/dev/null || true
            echo "==== offline server_name ===="
            grep -n "server_name\|listen \|proxy_pass\|default_server" /etc/nginx/sites-enabled/offlinebiztonsag.hu /etc/nginx/sites-available/offlinebiztonsag.hu 2>/dev/null || true
            if ! sudo -n true; then
              echo "sudo=no"
              exit 1
            fi
            echo "sudo=yes"
            sudo -n python3 - << 'PY'
            import pathlib, re, sys
            roots = [pathlib.Path("/etc/nginx/sites-available"), pathlib.Path("/etc/nginx/sites-enabled")]
            proxy = re.compile(r"proxy_pass\s+https?://(?:127\.0\.0\.1|localhost):3000\b")
            seen = set()
            files = []
            for root in roots:
                if not root.is_dir():
                    continue
                for path in root.iterdir():
                    if not path.is_file():
                        path = path.resolve() if path.is_symlink() else path
                    if not path.is_file() or path.suffix == ".bak-bim":
                        continue
                    real = path.resolve()
                    if real in seen:
                        continue
                    text = path.read_text(errors="replace")
                    if "vrgo.hu" in text and proxy.search(text):
                        seen.add(real)
                        files.append(path)
            if not files:
                sys.exit("no site-1 vhost proxies to 127.0.0.1:3000")
            for path in files:
                original = path.read_text()
                def add_name(match):
                    line = match.group(0)
                    if "bim.vrgo.hu" in line or "vrgo.hu" not in line:
                        return line
                    return line.replace(";", " bim.vrgo.hu;", 1)
                updated, _ = re.subn(r"(?m)^[ \t]*server_name\b[^;]*;", add_name, original)
                if updated == original:
                    print(f"already set {path}")
                    continue
                backup = pathlib.Path(str(path) + ".bak-bim")
                if not backup.exists():
                    backup.write_text(original)
                path.write_text(updated)
                print(f"updated {path}")
            PY
            echo "==== server_name ===="
            grep -n "server_name" /etc/nginx/sites-enabled/vrgo.hu /etc/nginx/sites-available/vrgo.hu
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "==== origin check ===="
            title="$(curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true)"
            echo "$title"
            certbot_status=ok
            if ! sudo -n certbot --nginx --non-interactive --expand --keep-until-expiring --redirect -d vrgo.hu -d www.vrgo.hu -d bim.vrgo.hu; then
              certbot_status=failed
            fi
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            title_after="$(curl -sk -m 15 --resolve bim.vrgo.hu:443:127.0.0.1 https://bim.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true)"
            report=/var/www/site-1/public/_bim_vhost_report.txt
            {
              echo "title_before=${title}"
              echo "title_after=${title_after}"
              echo "certbot=${certbot_status}"
              echo "==== enabled vrgo ===="
              sed -n '1,260p' /etc/nginx/sites-enabled/vrgo.hu
              echo "==== available vrgo ===="
              sed -n '1,260p' /etc/nginx/sites-available/vrgo.hu
              echo "==== enabled offline ===="
              sed -n '1,220p' /etc/nginx/sites-enabled/offlinebiztonsag.hu
              echo "==== nginx -T names ===="
              sudo -n nginx -T 2>/dev/null | grep -nE 'server_name|listen |proxy_pass|default_server|bim\.vrgo|vrgo\.hu|offlinebiztonsag'
            } > "$report"
            chmod 644 "$report"
            echo "certbot=${certbot_status} title_after=${title_after}"
            test "$certbot_status" = ok
