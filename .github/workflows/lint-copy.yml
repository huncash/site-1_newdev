name: lint-copy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint:copy
      - run: npm run test:articles
      - run: npm run typecheck
