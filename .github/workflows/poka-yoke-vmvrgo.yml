name: Poka-yoke drop and run as vmvrgohu

on:
  workflow_dispatch:

concurrency:
  group: poka-yoke-vmvrgo
  cancel-in-progress: false

jobs:
  stop-deploy-portfolio-pm2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Stop deploy PM2 site-1..4 only (keep szcenario)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            set -uo pipefail
            echo "whoami=$(whoami)"
            pm2 status || true
            for s in site-1 site-2 site-3 site-4; do
              pm2 delete "$s" || true
            done
            pm2 save || true
            echo "==== pm2 after delete (szcenario must remain) ===="
            pm2 status || true
            echo "==== ports ===="
            ss -lptn | grep -E ':300[0-3]\b|:5100\b' || true
            install -d -m 755 /home/deploy/bin || true
            ls -la /home/deploy/.ssh/authorized_keys || true

  drop-and-run:
    needs: stop-deploy-portfolio-pm2
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Drop script as deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scripts/poka-yoke-sites.sh
          target: /tmp
          strip_components: 1

      - name: chmod dropped script
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            sed -i 's/\r$//' /tmp/poka-yoke-sites.sh || true
            chmod 755 /tmp/poka-yoke-sites.sh
            ls -la /tmp/poka-yoke-sites.sh

      - name: Run poka-yoke as vmvrgohu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 20m
          script: |
            bash /tmp/poka-yoke-sites.sh
            echo "vmvrgohu_exit=$?"
            echo "==== site-4 nginx is :3004 — bind next there ===="
            pm2 delete site-4 || true
            cd /var/www/site-4
            find node_modules/.bin -type f -exec chmod a+x {} + 2>/dev/null || true
            pm2 start ./node_modules/.bin/next --name site-4 --cwd /var/www/site-4 -- start --port 3004
            pm2 save
            sleep 3
            ss -lptn | grep -E ':300[0-4]\b|:5100\b' || true
            echo -n "127.0.0.1:3004 "
            curl -sI -m 8 http://127.0.0.1:3004/ | head -n 1 || echo fail
            echo -n "rendezvenyarnyekolas.hu "
            curl -sI -m 12 -k https://rendezvenyarnyekolas.hu/ | head -n 1 || echo fail
