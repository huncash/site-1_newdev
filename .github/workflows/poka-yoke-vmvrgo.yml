name: Poka-yoke drop and run as vmvrgohu

on:
  workflow_dispatch:

concurrency:
  group: poka-yoke-vmvrgo
  cancel-in-progress: false

jobs:
  drop-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Drop script as deploy and write site-guard
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scripts/poka-yoke-sites.sh
          target: /tmp
          strip_components: 1

      - name: chmod dropped script as deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            set -uo pipefail
            sed -i 's/\r$//' /tmp/poka-yoke-sites.sh || true
            chmod 755 /tmp/poka-yoke-sites.sh
            ls -la /tmp/poka-yoke-sites.sh
            install -d -m 755 /home/deploy/bin
            echo "deploy can write bin=$(test -w /home/deploy/bin && echo yes || echo no)"
            echo "authorized_keys ls:"
            ls -la /home/deploy/.ssh /home/deploy/.ssh/authorized_keys 2>/dev/null || true
            lsattr /home/deploy/.ssh/authorized_keys 2>/dev/null || true

      - name: Run poka-yoke as vmvrgohu
        uses: appleboy/ssh-action@v1.2.0
        continue-on-error: true
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          command_timeout: 20m
          script: |
            bash /tmp/poka-yoke-sites.sh
            echo "vmvrgohu_exit=$?"
