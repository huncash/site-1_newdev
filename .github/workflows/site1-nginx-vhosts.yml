name: Ensure site-1 Nginx vhosts (:3000)

on:
  workflow_dispatch:

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Upload ensure script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: scripts/ensure-site1-vrgo-vhosts.sh
          target: /tmp/site1-nginx/
          strip_components: 1

      - name: Apply Nginx vhosts → 127.0.0.1:3000
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "===== inventory ====="
            ls -la /etc/nginx/sites-available || true
            ls -la /etc/nginx/sites-enabled || true
            grep -RIn --include='*' -E 'server_name|proxy_pass' /etc/nginx/sites-enabled /etc/nginx/sites-available 2>/dev/null | head -n 100 || true
            SCRIPT=/tmp/site1-nginx/ensure-site1-vrgo-vhosts.sh
            test -f "$SCRIPT"
            sed -i 's/\r$//' "$SCRIPT"
            chmod 755 "$SCRIPT"
            bash "$SCRIPT"
