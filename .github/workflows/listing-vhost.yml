name: Route eladoingatlan.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/listing-vhost.yml"

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Attach eladoingatlan.vrgo.hu to site-1 nginx vhost
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            echo "user=$(id)"
            if ! sudo -n true; then
              echo "sudo=no for vmvrgohu; cannot edit nginx"
              exit 1
            fi
            edited=0
            for f in /etc/nginx/sites-available/vrgo.hu /etc/nginx/sites-enabled/vrgo.hu; do
              if [[ -f "$f" ]]; then
                if grep -q 'eladoingatlan\.vrgo\.hu' "$f"; then
                  echo "already present in $f"
                else
                  sudo -n sed -i.bak-listing '/^[[:space:]]*server_name /{ /eladoingatlan\.vrgo\.hu/! s/;/ eladoingatlan.vrgo.hu;/ }' "$f"
                  echo "edited $f"
                  edited=1
                fi
              else
                echo "missing $f"
              fi
            done
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            echo "===== TITLE ====="
            curl -sk -m 15 --resolve eladoingatlan.vrgo.hu:443:127.0.0.1 https://eladoingatlan.vrgo.hu/ | grep -o '<title>[^<]*</title>' || true
            echo "===== server_name lines ====="
            grep -nE 'server_name' /etc/nginx/sites-enabled/vrgo.hu || true
            echo "edited_flag=$edited"
