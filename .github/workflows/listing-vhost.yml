name: Route eladoingatlan.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/listing-vhost.yml"
      - "scripts/ensure-eladoingatlan-vhost.sh"

concurrency:
  group: listing-vhost
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - uses: actions/checkout@v4

      # Inline SSH scripts as vmvrgohu are overridden by the site-1 deploy
      # ForceCommand on this key. Drop the script, then invoke it by path
      # (same pattern as poka-yoke-vmvrgo.yml).
      - name: Drop ensure-eladoingatlan-vhost.sh on the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scripts/ensure-eladoingatlan-vhost.sh
          target: /tmp
          strip_components: 1

      - name: Make dropped script executable
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            sed -i 's/\r$//' /tmp/ensure-eladoingatlan-vhost.sh || true
            chmod 755 /tmp/ensure-eladoingatlan-vhost.sh
            ls -la /tmp/ensure-eladoingatlan-vhost.sh

      - name: Install dedicated eladoingatlan.vrgo.hu Nginx block as vmvrgohu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail
            test -x /tmp/ensure-eladoingatlan-vhost.sh
            bash /tmp/ensure-eladoingatlan-vhost.sh
