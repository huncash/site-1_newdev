name: Route eladoingatlan.vrgo.hu to site-1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/listing-vhost.yml"
      - "scripts/ensure-eladoingatlan-vhost.sh"

concurrency:
  # Share the deploy lock so we do not race git/npm with deploy.yml
  group: vps-deploy-site-1
  cancel-in-progress: false

jobs:
  nginx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate VPS SSH key secret
        run: |
          test -n "${{ secrets.VPS_SSH_KEY }}" || (echo "Missing VPS_SSH_KEY secret" && exit 1)

      - name: Install dedicated eladoingatlan.vrgo.hu Nginx block
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 195.228.152.141
          username: vmvrgohu
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 10m
          script: |
            echo LISTING_VHOST_MARKER_START
            set -euo pipefail
            SCRIPT=/var/www/site-1/scripts/ensure-eladoingatlan-vhost.sh
            test -f "$SCRIPT"
            sed -i 's/\r$//' "$SCRIPT" || true
            chmod 755 "$SCRIPT"
            bash "$SCRIPT"
            echo LISTING_VHOST_MARKER_DONE
